name: LeadsPay scheduled publishing

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LeadsPay scheduler
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=leadspay-connect")
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")

          BODY_FILE=$(mktemp)
          HTTP_STATUS=$(curl --silent --show-error --output "$BODY_FILE" --write-out "%{http_code}" \
            --retry 2 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $TOKEN" \
            "https://leadspay-connect.vercel.app/api/cron/publish-scheduled")
          RESPONSE_BODY=$(tr "\n" " " < "$BODY_FILE" | head -c 500)

          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            echo "::error title=LeadsPay scheduler failed::HTTP $HTTP_STATUS: ${RESPONSE_BODY:-empty response}"
            exit 1
          fi

          echo "Scheduler completed: $RESPONSE_BODY"