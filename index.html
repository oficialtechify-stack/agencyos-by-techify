/* ===== LeadsPay Connect · Professional UI System v3 ===== */
:root{
  --bg:#07070a;
  --panel:#0d0d12;
  --panel2:#121219;
  --panel3:#171720;
  --line:#24242e;
  --line-strong:#343442;
  --text:#f7f7fb;
  --muted:#9696a6;
  --muted2:#6f6f7d;
  --purple:#7c3aed;
  --purple2:#8b5cf6;
  --purple3:#a78bfa;
  --ok:#22c55e;
  --warn:#f59e0b;
  --danger:#ef4444;
  --blue:#3b82f6;
  --shadow:0 24px 64px rgba(0,0,0,.34);
  --shadow-soft:0 10px 30px rgba(0,0,0,.18);
  --r:16px;
  --sidebar:268px;
}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:-.01em;
  background:
    radial-gradient(900px 560px at 86% -180px,rgba(124,58,237,.15),transparent 62%),
    radial-gradient(740px 520px at -220px 20%,rgba(99,102,241,.08),transparent 64%),
    var(--bg);
}
::selection{background:rgba(139,92,246,.35);color:#fff}
*{scrollbar-width:thin;scrollbar-color:#2f2f3c transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#2f2f3c;border-radius:999px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}
.app{grid-template-columns:var(--sidebar) minmax(0,1fr)}
.sidebar{
  padding:18px 14px;
  border-right:1px solid rgba(255,255,255,.065);
  background:linear-gradient(180deg,rgba(11,11,16,.98),rgba(8,8,12,.98));
  box-shadow:10px 0 40px rgba(0,0,0,.12);
}
.brand{padding:4px 8px 20px;gap:11px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(145deg,#9f7aea 0%,#7c3aed 54%,#5b21b6 100%);
  box-shadow:0 10px 24px rgba(124,58,237,.25),inset 0 1px 0 rgba(255,255,255,.22);
  font-size:13px;font-weight:800;letter-spacing:-.06em;
  border:1px solid rgba(255,255,255,.10);
}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.02em}
.brand small{
  margin-top:3px;font-size:9px;text-transform:uppercase;letter-spacing:.14em;
  color:#777787;font-weight:700;
}
.nav{gap:4px}
.nav button{
  min-height:42px;padding:0 11px;border-radius:10px;
  color:#9e9ead;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  transition:background .16s ease,color .16s ease,transform .16s ease,border-color .16s ease;
  position:relative;border:1px solid transparent;
}
.nav button:hover{background:#13131a;color:#eeeef4;border-color:#1f1f28;transform:translateX(1px)}
.nav button.active{
  background:linear-gradient(180deg,rgba(124,58,237,.16),rgba(124,58,237,.10));
  color:#f3efff;border-color:rgba(139,92,246,.22);
  box-shadow:none;
}
.nav button.active:before{
  content:"";position:absolute;left:-15px;top:10px;width:3px;height:20px;border-radius:0 5px 5px 0;
  background:linear-gradient(#a78bfa,#7c3aed);box-shadow:0 0 14px rgba(139,92,246,.55)
}
.nav .ico{width:20px;height:20px;display:grid;place-items:center;opacity:.9}
.nav .ico svg{width:17px;height:17px;stroke-width:1.8}
.sidebar-foot{left:14px;right:14px;bottom:14px}
.profile-mini{
  padding:10px 11px;border-radius:13px;background:#0d0d13;border-color:#202029;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
.avatar{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(145deg,rgba(139,92,246,.3),rgba(91,33,182,.18));
  border:1px solid rgba(139,92,246,.28);color:#ddd2ff;font-size:12px;
}
.profile-mini b{font-size:11.5px;font-weight:700}
.profile-mini small{font-size:9.5px;color:#777786;margin-top:2px}
.topbar{
  height:70px;padding:0 28px;gap:14px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(7,7,10,.72);backdrop-filter:blur(18px) saturate(1.2);
}
.search{max-width:520px}
.search:before{display:none}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#71717f;display:grid;place-items:center;pointer-events:none}
.search-icon svg{width:16px;height:16px;stroke-width:1.9}
.search input{
  height:40px;padding:0 14px 0 37px;border-radius:11px;background:#0e0e14;
  border-color:#202029;font-size:12px;color:#efeff4;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)
}
.search input::placeholder{color:#656573}
.search input:focus{border-color:#4b3b6a;box-shadow:0 0 0 3px rgba(124,58,237,.10)}
.top-actions{gap:8px}
.role-label{padding:0 4px}
.sync-chip{
  height:28px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;border:1px solid #24242d;
  background:#0f0f14;border-radius:999px;color:#8d8d9b;font-size:9.5px;font-weight:650;letter-spacing:.01em
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#6b7280;box-shadow:0 0 0 3px rgba(107,114,128,.09)}
.sync-chip.connected .sync-dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.10)}

function cloudFail(e,context='Sincronização'){console.error(context,e);state.cloudStatus='error';state.cloudError=e?.code||e?.message||String(e);const msg=String(e?.code||'');if(msg.includes('permission-denied'))console.warn('Permissão de sincronização pendente.');else if(msg.includes('storage/'))toast('Não foi possível enviar o arquivo para o armazenamento compartilhado.','err');}
async function persistProject(p){save();if(!state.user)return;try{await setDoc(doc(cloudDb,'projects',p.id),plain(p));state.cloudStatus='connected'}catch(e){cloudFail(e,'Salvar projeto')}}

function stopCloudSync(){for(const u of [unsubProjects,unsubActivity,unsubSettings]){try{u&&u()}catch{}}unsubProjects=unsubActivity=unsubSettings=null}
function startCloudSync(){stopCloudSync();if(!state.user)return;state.cloudStatus='connecting';
  unsubProjects=onSnapshot(collection(cloudDb,'projects'),snap=>{state.projects=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));save();state.cloudStatus='connected';if(state.role)render()},e=>cloudFail(e,'Sincronizar projetos'));
  unsubActivity=onSnapshot(collection(cloudDb,'activity'),snap=>{state.activity=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))).slice(0,300);save();if(state.role&&state.view==='history')render()},e=>cloudFail(e,'Sincronizar histórico'));

}
async function storeFile(file,projectId,index){const assetId=id('asset');if(state.user){try{const safe=(file.name||'arquivo').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-');const path=`content/${projectId}/${String(index+1).padStart(2,'0')}-${assetId}-${safe}`;const r=storageRef(cloudStorage,path);await uploadBytes(r,file,{contentType:file.type||'application/octet-stream'});const url=await getDownloadURL(r);return {id:assetId,name:file.name,type:file.type,size:file.size,order:index,url,path}}catch(e){cloudFail(e,'Upload');toast('Não consegui enviar este arquivo ao armazenamento compartilhado. Vou manter uma cópia local neste navegador.','err')}}await putAsset({id:assetId,name:file.name,type:file.type,size:file.size,blob:file});return {id:assetId,name:file.name,type:file.type,size:file.size,order:index,localOnly:true}}
function findAsset(assetId){for(const p of state.projects){const a=(p.assets||[]).find(x=>x.id===assetId);if(a)return a}return null}

function addActivity(action,projectId=null,detail=''){const item={id:id('act'),action,projectId,detail,by:roleName(),at:new Date().toISOString()};state.activity.unshift(item);save();if(state.user)setDoc(doc(cloudDb,'activity',item.id),plain(item)).catch(e=>cloudFail(e,'Salvar histórico'))}

async function apiAuth(url,options={}){if(!state.user)throw new Error('Faça login novamente.');const token=await state.user.getIdToken();state.idToken=token;const headers={...(options.headers||{}),Authorization:'Bearer '+token};if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(url,{...options,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Não foi possível concluir a ação.');return d}
async function apiAuthBlob(url){if(!state.user)throw new Error('Faça login novamente.');const token=await state.user.getIdToken();state.idToken=token;const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error('Não foi possível abrir o arquivo.');return r.blob()}

let teamPresenceTimer=null,teamChatTimer=null,lastChatSignature='';

function presenceShortLabel(){const p=state.otherPresence,name=p?.name||otherPersonFallback();return p?.online?name+' online':name+' offline'}
function presenceLongLabel(){const p=state.otherPresence;if(p?.online)return 'Online agora';if(!p?.lastSeen)return 'Offline';const d=new Date(p.lastSeen),diff=Date.now()-d.getTime();if(diff<60000)return 'Visto há instantes';if(diff<3600000)return 'Visto há '+Math.max(1,Math.floor(diff/60000))+' min';return 'Visto '+d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function updatePresenceUI(){const chip=document.getElementById('otherPresenceTop');if(chip){chip.classList.toggle('online',!!state.otherPresence?.online);const label=chip.querySelector('span:last-child');if(label)label.textContent=presenceShortLabel()}const dot=document.getElementById('chatPresenceDot');if(dot)dot.classList.toggle('online',!!state.otherPresence?.online);const txt=document.getElementById('chatPresenceText');if(txt)txt.textContent=presenceLongLabel()}
function updateChatBadge(){const b=document.querySelector('[data-nav="chat"]');if(!b)return;let x=b.querySelector('.nav-count');if(state.chatUnread>0){if(!x){x=document.createElement('span');x.className='nav-count';b.appendChild(x)}x.textContent=state.chatUnread>99?'99+':String(state.chatUnread)}else if(x)x.remove()}

async function sendPresence(){if(!state.user)return;try{await apiAuth('/api/team/presence',{method:'POST',body:JSON.stringify({visible:document.visibilityState==='visible'})})}catch(e){console.warn('Presence',e.message)}}

function renderChatListOnly(forceBottom=false){const el=document.getElementById('chatMessages');if(!el)return;const nearBottom=el.scrollHeight-el.scrollTop-el.clientHeight<120;el.innerHTML=chatMessagesHTML();hydrateChatAttachments(el);if(forceBottom||nearBottom)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight});const pin=document.getElementById('pinnedNotice');const latest=[...(state.chatMessages||[])].reverse().find(m=>m.type==='notice');if(pin){if(latest){pin.classList.add('show');pin.innerHTML='<b>📌 Aviso</b>'+esc(latest.text||'').replace(/\n/g,'<br>')}else{pin.classList.remove('show');pin.innerHTML=''}}}
async function pollChat(force=false){if(!state.user)return;try{const d=await apiAuth('/api/chat/messages');const msgs=d.messages||[];const sig=msgs.length?msgs[msgs.length-1].id+'|'+msgs.length:'0';const previous=state.chatMessages||[];const had=previous.length?previous[previous.length-1].id:null;state.chatMessages=msgs;const readAt=localStorage.getItem(K.chatRead)||'';if(state.view==='chat'&&document.visibilityState==='visible')markChatRead();else state.chatUnread=msgs.filter(m=>m.sender?.email!==state.user?.email&&String(m.at)>readAt).length;updateChatBadge();if(state.view==='chat'&&(force||sig!==lastChatSignature))renderChatListOnly(!had);if(had&&sig!==lastChatSignature){const newest=msgs[msgs.length-1];if(newest&&newest.id!==had&&newest.sender?.email!==state.user?.email&&state.view!=='chat')toast((newest.type==='notice'?'Aviso de ':'Mensagem de ')+(newest.sender?.name||'equipe'))}lastChatSignature=sig}catch(e){console.warn('Chat poll',e.message)}}

function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function refreshPushState(){if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){state.pushEnabled=false;return}try{const reg=await navigator.serviceWorker.register('/sw.js');const sub=await reg.pushManager.getSubscription();state.pushEnabled=Notification.permission==='granted'&&!!sub;const b=document.getElementById('notifyBtn');if(b){b.classList.toggle('enabled',state.pushEnabled);b.innerHTML=state.pushEnabled?'✓ Notificações ativas':'Ativar notificações'}}catch{state.pushEnabled=false}}
async function enablePushNotifications(){if(!('serviceWorker'in navigator)||!('PushManager'in window)){toast('Este navegador não oferece notificações em segundo plano.','err');return}try{const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('Permissão de notificações não concedida.');const reg=await navigator.serviceWorker.register('/sw.js');const keyData=await fetch('/api/push/public-key').then(r=>r.json());if(!keyData.publicKey)throw new Error('Notificações ainda não estão configuradas.');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(keyData.publicKey)});await apiAuth('/api/push/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})});state.pushEnabled=true;toast('Notificações ativadas neste dispositivo');refreshPushState()}catch(e){toast(e.message||'Não foi possível ativar notificações.','err')}}

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('leadspay-connect',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('assets'))r.result.createObjectStore('assets',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function putAsset(obj){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').put(obj);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getAsset(assetId){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('assets').objectStore('assets').get(assetId);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function delAsset(assetId){const db=await openDB();return new Promise((res)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').delete(assetId);tx.oncomplete=()=>res()})}
async function clearAssets(){const db=await openDB();return new Promise((res)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').clear();tx.oncomplete=()=>res()})}

function render(){if(state.user&&!state.role){renderProfileSetup();return}if(!state.user){renderLogin();return}document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">LP</div><div><b>LeadsPay Connect</b><small>Content workspace</small></div></div><nav class="nav">${navForRole().map(n=>`<button data-nav="${n[0]}" class="${state.view===n[0]?'active':''}"><span class="ico">${icon(n[1])}</span>${n[2]}${n[0]==='chat'&&state.chatUnread?'<span class="nav-count">'+state.chatUnread+'</span>':''}</button>`).join('')}</nav><div class="sidebar-foot"><div class="profile-mini"><div class="avatar">${esc(roleName().slice(0,1).toUpperCase())}</div><div><b>${esc(roleName())}</b><small>${roleLabel()} · ${state.cloudStatus==='connected'?'online':'workspace'}</small></div></div></div></aside><main class="main"><header class="topbar"><button class="icon-btn mobile-menu" data-action="menu" aria-label="Abrir menu">${icon('menu')}</button><div class="search"><span class="search-icon">${icon('search')}</span><input id="globalSearch" placeholder="Buscar conteúdos, campanhas e tags..." value="${esc(state.search)}"></div><div class="top-actions"><span class="presence-chip ${state.otherPresence?.online?'online':''}" id="otherPresenceTop"><span class="presence-dot"></span><span>${presenceShortLabel()}</span></span><span class="sync-chip ${state.cloudStatus}"><span class="sync-dot"></span>${syncLabel()}</span><span class="role-label" style="color:var(--muted);font-size:10px">${esc(roleLabel())}</span><button class="btn ghost" data-action="switchRole">${icon('logout')}<span>Sair</span></button>${state.role==='designer'?'<button class="btn primary" data-action="new">'+icon('plus')+'<span>Novo conteúdo</span></button>':''}</div></header><section class="content" id="page"></section></main></div>`;renderPage();bindTop();}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="login"><div class="auth-shell"><section class="auth-story"><div class="auth-brand"><div class="brand-mark">LP</div><strong>LeadsPay Connect</strong></div><div class="auth-story-copy"><span class="eyebrow">Workspace privado</span><h1>Do design à publicação, tudo no mesmo fluxo.</h1><p>Organize carrosséis, centralize feedbacks, aprove alterações e mantenha o calendário da LeadsPay sempre em ordem.</p></div><div class="auth-feature-list"><div class="auth-feature"><span>${icon('carousel')}</span><b>Conteúdo organizado</b><small>Carrosséis e materiais separados por projeto.</small></div><div class="auth-feature"><span>${icon('check')}</span><b>Aprovação rápida</b><small>Feedback e status sem depender do WhatsApp.</small></div><div class="auth-feature"><span>${icon('calendar')}</span><b>Calendário visual</b><small>Veja tudo que está pronto e agendado.</small></div><div class="auth-feature"><span>${icon('send')}</span><b>Pronto para publicar</b><small>Fluxo preparado para automação oficial.</small></div></div></section><section class="login-card"><div class="auth-form-head"><span class="eyebrow">Acesso da equipe</span><h2>Bem-vindo de volta</h2><p>Entre com uma das contas autorizadas para acessar o workspace.</p></div><div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="email" placeholder="seu e-mail de acesso"></div><div class="field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Sua senha"></div><label class="remember-row"><input id="rememberLogin" type="checkbox" checked> Manter conectado neste dispositivo</label><button class="btn primary" id="loginBtn" style="width:100%">Entrar no LeadsPay Connect</button><div class="login-note">Acesso restrito à equipe autorizada. Sua senha é validada por um serviço seguro de autenticação e não fica salva no código do site.</div></section></div></div>`;const go=async()=>{const email=document.getElementById('loginEmail').value.trim().toLowerCase(),password=document.getElementById('loginPassword').value,remember=document.getElementById('rememberLogin').checked;if(!email||!password){toast('Informe e-mail e senha.','err');return}if(!AUTHORIZED_USERS[email]){toast('Este e-mail não está autorizado no LeadsPay Connect.','err');return}const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Entrando...';try{await setPersistence(auth,remember?browserLocalPersistence:browserSessionPersistence);await signInWithEmailAndPassword(auth,email,password)}catch(e){console.error(e);const code=e?.code||'';const msg=code.includes('configuration-not-found')?'O serviço de autenticação ainda não está configurado.':code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found')?'E-mail ou senha incorretos, ou esta conta ainda não foi liberada.':code.includes('operation-not-allowed')?'O login por e-mail ainda não está liberado.':code.includes('too-many-requests')?'Muitas tentativas. Aguarde um pouco e tente novamente.':'Não foi possível entrar: '+code;toast(msg,'err');b.disabled=false;b.textContent='Entrar'}};document.getElementById('loginBtn').onclick=go;document.getElementById('loginPassword').onkeydown=e=>{if(e.key==='Enter')go()}}

function bindTop(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;if(state.role==='designer'&&state.view==='settings')state.view='profile';document.getElementById('sidebar').classList.remove('open');render()});const newBtn=document.querySelector('[data-action="new"]');if(newBtn)newBtn.onclick=()=>openCreate();document.querySelector('[data-action="switchRole"]').onclick=async()=>{await signOut(auth)};document.querySelector('[data-action="menu"]').onclick=()=>document.getElementById('sidebar').classList.toggle('open');const s=document.getElementById('globalSearch');let t;s.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{state.search=s.value.trim();if(state.view==='dashboard')state.view='library';render()},220)}}
function pageHead(title,sub,action=''){return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function renderPage(){const p=document.getElementById('page');if(!p)return;if(state.role==='designer'&&state.view==='settings')state.view='profile';if(state.role==='admin'&&state.view==='profile')state.view='settings';const f={dashboard:dashboardPage,instagram:()=>channelPage('instagram'),site:()=>channelPage('site'),calendar:calendarPage,approvals:approvalsPage,library:libraryPage,history:historyPage,integrations:integrationsPage,chat:chatPage,settings:settingsPage,profile:profilePage};p.innerHTML=(f[state.view]||dashboardPage)();bindPage();hydrateImages();}
function localNotice(){return ''}
function dashboardPage(){const counts={review:0,scheduled:0,published:0,changes:0};state.projects.forEach(p=>{if(counts[p.status]!==undefined)counts[p.status]++});const upcoming=state.projects.filter(p=>p.scheduledAt&&new Date(p.scheduledAt)>=new Date()&&p.status!=='published').sort((a,b)=>new Date(a.scheduledAt)-new Date(b.scheduledAt)).slice(0,6);return `<div class="dashboard-hero"><div class="hero-row"><div class="hero-copy"><span class="eyebrow">LeadsPay · Conteúdo</span><h1>Olá, ${esc(roleName())}.</h1><p>Seu painel para organizar, revisar e preparar tudo que vai para o Instagram e para o site.</p></div><div class="hero-actions"><button class="btn" data-navjump="calendar">${icon('calendar')}<span>Ver calendário</span></button><button class="btn primary" data-new-platform="instagram" data-new-format="Carrossel">${icon('plus')}<span>Novo carrossel</span></button></div></div></div>`+localNotice()+`<div class="grid stats"><div class="stat"><div class="stat-top"><span class="stat-icon">${icon('approvals')}</span><span class="stat-kicker">Revisão</span></div><div class="num">${counts.review}</div><div class="hint">aguardando sua aprovação</div></div><div class="stat"><div class="stat-top"><span class="stat-icon">${icon('calendar')}</span><span class="stat-kicker">Agenda</span></div><div class="num">${counts.scheduled}</div><div class="hint">conteúdos programados</div></div><div class="stat"><div class="stat-top"><span class="stat-icon">${icon('edit')}</span><span class="stat-kicker">Ajustes</span></div><div class="num">${counts.changes}</div><div class="hint">alterações solicitadas</div></div><div class="stat"><div class="stat-top"><span class="stat-icon">${icon('check')}</span><span class="stat-kicker">Concluído</span></div><div class="num">${counts.published}</div><div class="hint">conteúdos publicados</div></div></div><div class="grid split"><div class="card"><div class="card-h"><h3>Próximas publicações</h3><button class="btn sm" data-navjump="calendar">Abrir calendário</button></div><div class="card-b">${upcoming.length?`<div class="list">${upcoming.map(rowHTML).join('')}</div>`:emptyHTML('▦','Nenhuma publicação agendada','Quando você agendar um conteúdo, ele aparece aqui.')}</div></div><div class="card"><div class="card-h"><h3>Ações rápidas</h3></div><div class="card-b"><div class="quick-grid"><button class="quick" data-new-platform="instagram" data-new-format="Carrossel"><span>${icon('carousel')}</span><b>Novo carrossel</b><small>Envie todos os slides de uma vez.</small></button><button class="quick" data-new-platform="instagram" data-new-format="Story"><span>${icon('story')}</span><b>Novo story</b><small>Organize conteúdo vertical.</small></button><button class="quick" data-new-platform="site" data-new-format="Banner"><span>${icon('image')}</span><b>Design do site</b><small>Banners, campanhas e telas.</small></button><button class="quick" data-navjump="approvals"><span>${icon('approvals')}</span><b>Aprovações</b><small>Revise o que está pendente.</small></button></div></div></div></div>`}
function emptyHTML(icon,title,sub){return `<div class="empty"><div class="big">${icon}</div><b>${title}</b><div style="margin-top:5px;font-size:11px">${sub}</div></div>`}
function rowHTML(p){return `<div class="row" data-open="${p.id}">${p.assets?.length?`<img class="thumb" data-asset-img="${p.assets[0].id}" alt="">`:`<div class="thumb ph">▧</div>`}<div class="row-main"><b>${esc(p.title)}</b><small>${esc(p.platform==='instagram'?'Instagram':'Site')} · ${esc(p.format)}${p.scheduledAt?' · '+new Date(p.scheduledAt).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):''}</small></div>${statusBadge(p.status)}</div>`}
function filtered(platform=null){const q=state.search.toLowerCase();return state.projects.filter(p=>(!platform||p.platform===platform)&&(!q||[p.title,p.campaign,p.caption,(p.tags||[]).join(' '),p.format].join(' ').toLowerCase().includes(q)))}
function channelPage(platform){const list=filtered(platform);const folders=fmt[platform].map(f=>({f,n:list.filter(p=>p.format===f).length}));return pageHead(platform==='instagram'?'Instagram':'Designs do Site',platform==='instagram'?'Carrosséis, posts, stories, capas de Reels e outros conteúdos.':'Banners, landing pages, campanhas e elementos visuais do site.',`<button class="btn primary" data-new-platform="${platform}">＋ Novo</button>`)+`<div class="folder-grid">${folders.map(x=>`<button class="folder" data-filter-format="${esc(x.f)}" style="color:inherit;text-align:left"><div class="ficon">${platform==='instagram'?'▣':'◫'}</div><b>${esc(x.f)}</b><small>${x.n} conteúdo${x.n===1?'':'s'}</small></button>`).join('')}</div><div class="filters"><select id="statusFilter"><option value="">Todos os status</option>${Object.entries(statusLabel).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="formatFilter"><option value="">Todos os formatos</option>${fmt[platform].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="projectList">${projectGridHTML(list)}</div>`}
function projectGridHTML(list){if(!list.length)return emptyHTML('▣','Nenhum conteúdo encontrado','Crie o primeiro conteúdo para começar a organizar seu trabalho.');return `<div class="project-grid">${list.map(p=>`<article class="card project" data-open="${p.id}"><div class="project-cover">${p.assets?.length?`<img data-asset-img="${p.assets[0].id}" alt="">`:`<div class="cover-ph">▧</div>`}${p.assets?.length>1?`<div class="count">${p.assets.length} slides</div>`:''}</div><div class="project-body"><div class="project-top"><h3>${esc(p.title)}</h3>${statusBadge(p.status)}</div><p>${esc(p.campaign||'Sem campanha')} · ${esc(p.format)}</p><div class="tags">${(p.tags||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="project-foot"><span>${esc(p.createdBy||'')}</span><span>${new Date(p.updatedAt||p.createdAt).toLocaleDateString('pt-BR')}</span></div></div></article>`).join('')}</div>`}
function approvalsPage(){const list=filtered().filter(p=>p.status==='review'||p.status==='changes');return pageHead('Aprovações','Revise artes, peça alterações ou aprove para agendamento.')+`<div class="card"><div class="card-b">${list.length?`<div class="list">${list.map(rowHTML).join('')}</div>`:emptyHTML('✓','Tudo em dia','Não existe conteúdo aguardando aprovação ou alteração.')}</div></div>`}
function libraryPage(){const list=filtered();return pageHead('Biblioteca','Encontre qualquer design antigo sem procurar mensagens no WhatsApp.')+`<div class="filters"><select id="platformFilter"><option value="">Instagram + Site</option><option value="instagram">Instagram</option><option value="site">Site</option></select><select id="statusFilter"><option value="">Todos os status</option>${Object.entries(statusLabel).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><span style="font-size:11px;color:var(--muted);align-self:center">${list.length} conteúdo${list.length===1?'':'s'}</span></div><div id="projectList">${projectGridHTML(list)}</div>`}
function calendarPage(){const base=new Date(state.calDate.getFullYear(),state.calDate.getMonth(),1);const start=new Date(base);start.setDate(1-((base.getDay()+6)%7));const days=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}const ym=base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return pageHead('Calendário','Visualize tudo que já está programado por dia e horário.')+`<div class="card"><div class="card-b"><div class="cal-head"><button class="btn sm" data-cal="prev">←</button><b style="text-transform:capitalize">${esc(ym)}</b><button class="btn sm" data-cal="next">→</button></div><div class="calendar-wrap"><div class="cal-grid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="dow">${x}</div>`).join('')}${days.map(d=>{const same=d.getMonth()===base.getMonth();const today=new Date().toDateString()===d.toDateString();const ev=state.projects.filter(p=>p.scheduledAt&&new Date(p.scheduledAt).toDateString()===d.toDateString()).sort((a,b)=>new Date(a.scheduledAt)-new Date(b.scheduledAt));return `<div class="day ${same?'':'muted'} ${today?'today':''}"><span class="n">${d.getDate()}</span>${ev.slice(0,4).map(p=>`<div class="cal-event" data-open="${p.id}">${new Date(p.scheduledAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${esc(p.title)}</div>`).join('')}${ev.length>4?`<div style="font-size:9px;color:var(--muted);margin-top:5px">+${ev.length-4} mais</div>`:''}</div>`}).join('')}</div></div></div></div>`}
function historyPage(){return pageHead('Histórico','Registro das ações feitas dentro do LeadsPay Connect.')+`<div class="card"><div class="card-b">${state.activity.length?`<div class="list">${state.activity.slice(0,80).map(a=>`<div class="activity"><b>${esc(a.action)}</b><p>${esc(a.by)} · ${new Date(a.at).toLocaleString('pt-BR')}${a.detail?' · '+esc(a.detail):''}</p></div>`).join('')}</div>`:emptyHTML('↺','Histórico vazio','As atividades aparecerão aqui conforme vocês usarem o sistema.')}</div></div>`}
function integrationsPage(){const action=state.role==='admin'?'<button class="btn sm primary" id="metaConnectBtn">Conectar Instagram</button>':'';return pageHead('Integrações','Conexão oficial usada pela designer para publicar conteúdos aprovados.')+`<div class="grid" style="gap:12px"><div class="integration"><div class="logo">${icon('instagram')}</div><div class="grow"><b>Instagram / Meta</b><p id="metaStatusText"><span class="status-dot" id="metaStatusDot"></span>Verificando conexão oficial...</p></div>${action}</div></div><div class="card" style="margin-top:16px"><div class="card-h"><h3>Fluxo protegido</h3></div><div class="card-b" style="color:var(--muted);font-size:11px;line-height:1.7">A designer envia o conteúdo para aprovação. Depois que o administrador aprovar, somente a designer pode publicar ou agendar. Se o conteúdo aprovado for alterado, a autorização deixa de valer.</div></div>`}
function settingsPage(){if(state.role!=='admin')return profilePage();return pageHead('Configurações','Ajuste os dados administrativos e faça backup do workspace.')+`<div class="settings-grid"><div class="card"><div class="card-h"><h3>Equipe</h3></div><div class="card-b"><div class="field"><label>Nome do administrador</label><input id="adminName" value="${esc(state.settings.adminName)}"></div><div class="field"><label>Nome da designer</label><input id="designerName" value="${esc(state.settings.designerName)}"></div><div class="field"><label>Empresa / marca</label><input id="companyName" value="${esc(state.settings.company)}"></div><button class="btn primary" data-action="saveSettings">Salvar alterações</button></div></div><div class="card"><div class="card-h"><h3>Dados e backup</h3></div><div class="card-b"><p style="color:var(--muted);font-size:11px;line-height:1.55">Exporte os dados de organização em JSON. Os arquivos de imagem ficam no armazenamento compartilhado e não entram no JSON.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="export">Exportar dados</button><label class="btn" style="display:inline-block"><input id="importFile" type="file" accept="application/json" style="display:none">Importar dados</label><button class="btn danger" data-action="reset">Apagar tudo</button></div></div></div></div>`}

function profilePage(){const p=state.profile||{};const displayName=p.name||'Designer';const initials=displayName.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'D';return pageHead('Meu perfil','Preencha seus dados profissionais para deixar seu acesso identificado no workspace.')+`<div class="settings-grid"><div class="card"><div class="card-h"><h3>Perfil profissional</h3></div><div class="card-b"><div style="display:flex;align-items:center;gap:14px;padding:4px 0 20px"><div class="avatar" style="width:54px;height:54px;border-radius:16px;font-size:16px">${esc(initials)}</div><div><b style="font-size:14px">${esc(displayName)}</b><div style="font-size:10px;color:var(--muted);margin-top:4px">Designer · LeadsPay Connect</div></div></div><div class="field"><label>Nome completo</label><input id="profileName" maxlength="80" value="${esc(p.name||'')}" placeholder="Ex.: Vitória"></div><div class="form-grid"><div class="field"><label>Cargo / função</label><input id="profileJob" maxlength="80" value="${esc(p.jobTitle||'Designer')}" placeholder="Ex.: Designer gráfico"></div><div class="field"><label>WhatsApp</label><input id="profilePhone" maxlength="30" value="${esc(p.phone||'')}" placeholder="(81) 99999-9999"></div></div><div class="field"><label>Instagram</label><input id="profileInstagram" maxlength="80" value="${esc(p.instagram||'')}" placeholder="@seuusuario"></div><div class="field"><label>Sobre você</label><textarea id="profileBio" maxlength="300" placeholder="Conte um pouco sobre seu trabalho...">${esc(p.bio||'')}</textarea><div style="text-align:right;color:var(--muted2);font-size:9px;margin-top:-7px">até 300 caracteres</div></div><button class="btn primary" data-action="saveProfile">Salvar perfil</button></div></div><div class="card"><div class="card-h"><h3>Conta</h3></div><div class="card-b"><div class="meta-box"><h4>E-mail de acesso</h4><p>${esc(state.user?.email||'')}</p></div><div class="meta-box"><h4>Nível de acesso</h4><p>Designer · pode criar conteúdos, enviar para aprovação e publicar somente depois da aprovação do administrador.</p></div><div class="meta-box"><h4>Identificação no histórico</h4><p>O nome salvo no seu perfil será usado nos comentários, conteúdos e atividades futuras.</p></div></div></div></div>`}

async function loadMetaStatus(){const textEl=document.getElementById('metaStatusText'),dot=document.getElementById('metaStatusDot'),btn=document.getElementById('metaConnectBtn');if(!textEl||!btn)return;try{const r=await fetch('/api/meta/status',{credentials:'include'});const d=await r.json();if(d.connected){textEl.innerHTML='<span class="status-dot" id="metaStatusDot" style="background:#22c55e"></span>@'+esc(d.profile?.username||'instagram')+' · conta profissional conectada';btn.textContent='Desconectar';btn.dataset.connected='true';btn.classList.remove('primary')}else if(d.configured){textEl.innerHTML='<span class="status-dot" id="metaStatusDot" style="background:#f59e0b"></span>Pronto para conectar a conta profissional da LeadsPay';btn.textContent='Conectar Instagram';btn.dataset.connected='false';btn.classList.add('primary')}else{textEl.innerHTML='<span class="status-dot" id="metaStatusDot" style="background:#f59e0b"></span>Integração preparada · faltam as credenciais do app da Meta na Vercel';btn.textContent='Configurar Meta';btn.dataset.connected='false';btn.classList.add('primary')}}catch(e){textEl.innerHTML='<span class="status-dot" style="background:#ef4444"></span>Não foi possível verificar a conexão com a Meta';btn.textContent='Tentar novamente';btn.dataset.connected='false'}}
async function handleMetaButton(){const btn=document.getElementById('metaConnectBtn');if(!btn)return;if(state.role!=='admin'){toast('Somente o administrador pode alterar a conexão do Instagram.','err');return}if(btn.dataset.connected==='true'){btn.disabled=true;try{await apiAuth('/api/meta/disconnect',{method:'POST'});toast('Instagram desconectado.');loadMetaStatus()}catch(e){toast(e.message,'err')}finally{btn.disabled=false}}else{window.location.href='/api/meta/connect'}}
function bindPage(){document.querySelectorAll('[data-open]').forEach(x=>x.onclick=(e)=>{e.stopPropagation();openDetail(x.dataset.open)});document.querySelectorAll('[data-navjump]').forEach(x=>x.onclick=()=>{state.view=x.dataset.navjump;render()});document.querySelectorAll('[data-new-platform]').forEach(x=>x.onclick=()=>openCreate(x.dataset.newPlatform,x.dataset.newFormat||''));document.querySelectorAll('[data-filter-format]').forEach(x=>x.onclick=()=>{const f=document.getElementById('formatFilter');if(f){f.value=x.dataset.filterFormat;applyFilters()}});['statusFilter','formatFilter','platformFilter'].forEach(i=>{const el=document.getElementById(i);if(el)el.onchange=applyFilters});document.querySelectorAll('[data-cal]').forEach(x=>x.onclick=()=>{state.calDate=new Date(state.calDate.getFullYear(),state.calDate.getMonth()+(x.dataset.cal==='next'?1:-1),1);renderPage()});const saveProfile=document.querySelector('[data-action="saveProfile"]');if(saveProfile)saveProfile.onclick=async()=>{if(state.role!=='designer'){toast('Esta área é exclusiva da designer.','err');return}const name=document.getElementById('profileName').value.trim();if(name.length<2){toast('Informe seu nome.','err');return}saveProfile.disabled=true;saveProfile.textContent='Salvando...';try{const data={name,jobTitle:document.getElementById('profileJob').value.trim()||'Designer',phone:document.getElementById('profilePhone').value.trim(),instagram:document.getElementById('profileInstagram').value.trim(),bio:document.getElementById('profileBio').value.trim(),role:'designer',email:state.user.email,updatedAt:new Date().toISOString()};await setDoc(doc(cloudDb,'users',state.user.uid),data,{merge:true});state.profile={...(state.profile||{}),...data};state.settings.designerName=name;save();addActivity('Atualizou o próprio perfil');toast('Perfil salvo com sucesso');render()}catch(e){cloudFail(e,'Salvar perfil');toast('Não foi possível salvar o perfil.','err')}finally{if(saveProfile){saveProfile.disabled=false;saveProfile.textContent='Salvar perfil'}}};const saveSet=document.querySelector('[data-action="saveSettings"]');if(saveSet)saveSet.onclick=()=>{state.settings.adminName=document.getElementById('adminName').value.trim()||'Rick';state.settings.designerName=document.getElementById('designerName').value.trim()||'Designer';state.settings.company=document.getElementById('companyName').value.trim()||'LeadsPay';persistSettings();addActivity('Atualizou configurações');toast('Configurações salvas');render()};const exp=document.querySelector('[data-action="export"]');if(exp)exp.onclick=exportData;const imp=document.getElementById('importFile');if(imp)imp.onchange=importData;const reset=document.querySelector('[data-action="reset"]');if(reset)reset.onclick=resetData;const metaBtn=document.getElementById('metaConnectBtn');if(metaBtn){metaBtn.onclick=handleMetaButton;loadMetaStatus()}}
function applyFilters(){const platform=document.getElementById('platformFilter')?.value||((state.view==='instagram'||state.view==='site')?state.view:'');const status=document.getElementById('statusFilter')?.value||'';const formatV=document.getElementById('formatFilter')?.value||'';let list=filtered(platform||null);if(status)list=list.filter(p=>p.status===status);if(formatV)list=list.filter(p=>p.format===formatV);const c=document.getElementById('projectList');if(c){c.innerHTML=projectGridHTML(list);c.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openDetail(x.dataset.open));hydrateImages(c)}}
async function hydrateImages(scope=document){const imgs=[...scope.querySelectorAll('[data-asset-img]')];for(const img of imgs){if(img.dataset.hydrated)continue;img.dataset.hydrated='1';try{const meta=findAsset(img.dataset.assetImg);if(meta?.url){img.src=meta.url;continue}const a=await getAsset(img.dataset.assetImg);if(a?.blob)img.src=URL.createObjectURL(a.blob)}catch{}}}
function openCreate(platform='instagram',formatV=''){if(state.role!=='designer'){toast('Seu perfil é somente de aprovação. A designer cria os conteúdos.','err');return}state.draftFiles=[];const o=document.getElementById('overlay');o.innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-h"><h2>Novo conteúdo</h2><button class="x" data-close>×</button></div><div class="modal-b"><div class="form-grid"><div class="field"><label>Área</label><select id="cPlatform"><option value="instagram" ${platform==='instagram'?'selected':''}>Instagram</option><option value="site" ${platform==='site'?'selected':''}>Site</option></select></div><div class="field"><label>Formato</label><select id="cFormat"></select></div></div><div class="form-grid"><div class="field"><label>Título da publicação / pasta</label><input id="cTitle" placeholder="Ex.: Como vender mais com a LeadsPay"></div><div class="field"><label>Campanha / pasta principal</label><input id="cCampaign" placeholder="Ex.: Vendas, Lançamento, Black Friday"></div></div><div class="field"><label>Tags (separadas por vírgula)</label><input id="cTags" placeholder="pix, checkout, vendas"></div><div class="field"><label>Legenda / observações</label><textarea id="cCaption" placeholder="Legenda que será usada na publicação..."></textarea></div><div class="upload"><input type="file" id="cFiles" accept="image/*" multiple><label for="cFiles"><div class="uico">⇧</div><b>Selecionar imagens</b><small>Escolha todos os slides de uma vez. Depois você pode arrastar para alterar a ordem.</small></label></div><div class="slides" id="draftSlides"></div><div class="modal-actions"><button class="btn" data-save="draft">Salvar rascunho</button><button class="btn primary" data-save="review">Enviar para aprovação</button></div></div></div></div>`;const plat=document.getElementById('cPlatform'),form=document.getElementById('cFormat');function setFormats(){form.innerHTML=fmt[plat.value].map(x=>`<option ${x===formatV?'selected':''}>${esc(x)}</option>`).join('')}setFormats();plat.onchange=()=>{formatV='';setFormats()};document.querySelector('[data-close]').onclick=closeOverlay;document.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))closeOverlay()};document.getElementById('cFiles').onchange=e=>{state.draftFiles.push(...[...e.target.files]);renderDraftSlides()};document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveNewContent(b.dataset.save));}
function renderDraftSlides(){const c=document.getElementById('draftSlides');if(!c)return;c.innerHTML=state.draftFiles.map((f,i)=>`<div class="slide" draggable="true" data-draft-index="${i}"><img src="${URL.createObjectURL(f)}"><span class="sn">${i+1}</span><button class="remove" data-remove-draft="${i}">×</button></div>`).join('');c.querySelectorAll('[data-remove-draft]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.draftFiles.splice(+b.dataset.removeDraft,1);renderDraftSlides()});c.querySelectorAll('[data-draft-index]').forEach(el=>{el.ondragstart=()=>{state.draftDrag=+el.dataset.draftIndex;el.classList.add('drag')};el.ondragend=()=>el.classList.remove('drag');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const to=+el.dataset.draftIndex,from=state.draftDrag;if(from===null||from===to)return;const [m]=state.draftFiles.splice(from,1);state.draftFiles.splice(to,0,m);state.draftDrag=null;renderDraftSlides()}})}
async function saveNewContent(status){if(state.role!=='designer'){toast('Somente a designer pode criar conteúdo.','err');return}const title=document.getElementById('cTitle').value.trim();if(!title){toast('Dê um título para o conteúdo','err');return}const pId=id('prj');const assets=[];for(let i=0;i<state.draftFiles.length;i++)assets.push(await storeFile(state.draftFiles[i],pId,i));const p={id:pId,title,platform:document.getElementById('cPlatform').value,format:document.getElementById('cFormat').value,campaign:document.getElementById('cCampaign').value.trim(),tags:document.getElementById('cTags').value.split(',').map(x=>x.trim()).filter(Boolean),caption:document.getElementById('cCaption').value.trim(),assets,status,scheduledAt:null,comments:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),createdBy:roleName(),createdByUid:state.user?.uid||null};state.projects.unshift(p);await persistProject(p);addActivity(status==='review'?'Enviou conteúdo para aprovação':'Criou rascunho',p.id,p.title);closeOverlay();toast(status==='review'?'Conteúdo enviado para aprovação':'Rascunho salvo');render()}
function closeOverlay(){document.getElementById('overlay').innerHTML='';state.detailId=null}
function openDetail(pid){const p=state.projects.find(x=>x.id===pid);if(!p)return;state.detailId=pid;state.detailSlide=0;const isAdmin=state.role==='admin',isDesigner=state.role==='designer';const canPublish=isDesigner&&p.platform==='instagram'&&(p.status==='approved'||p.status==='scheduled');const canSchedule=canPublish;const scheduleBox=canSchedule?`<div class="meta-box"><h4>Agendamento</h4><div class="form-grid"><div class="field" style="margin:0"><input id="dDate" type="date" value="${p.scheduledAt?new Date(p.scheduledAt).toISOString().slice(0,10):''}"></div><div class="field" style="margin:0"><input id="dTime" type="time" value="${p.scheduledAt?new Date(p.scheduledAt).toTimeString().slice(0,5):''}"></div></div><button class="btn sm" style="margin-top:8px" data-action="schedule">Agendar publicação</button></div>`:`<div class="meta-box"><h4>Publicação</h4><p>${p.status==='review'?'Aguardando aprovação do administrador.':p.status==='changes'?'Alterações solicitadas.':p.status==='published'?'Conteúdo publicado no Instagram.':p.status==='approved'&&!isDesigner?'Aprovado. A designer já pode publicar ou agendar.':'A publicação fica liberada somente depois da aprovação.'}</p></div>`;const deleteBtn=isDesigner&&(p.status==='draft'||p.status==='changes')?'<button class="btn danger sm" data-action="delete">Excluir</button>':'<span></span>';const actions=[isDesigner&&p.status==='draft'?'<button class="btn primary" data-action="sendReview">Enviar para aprovação</button>':'',isDesigner&&p.status==='changes'?'<button class="btn primary" data-action="resubmit">Reenviar para aprovação</button>':'',isAdmin&&p.status==='review'?'<button class="btn danger" data-action="requestChanges">Pedir alteração</button><button class="btn primary" data-action="approve">Aprovar</button>':'',canPublish?'<button class="btn primary" data-action="publishNow">'+icon('send')+' Publicar agora</button>':''].join('');const o=document.getElementById('overlay');o.innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-h"><div><h2>${esc(p.title)}</h2><div style="margin-top:5px">${statusBadge(p.status)}</div></div><button class="x" data-close>×</button></div><div class="modal-b"><div class="detail-grid"><div><div class="viewer" id="viewer">${p.assets.length?`<img data-asset-img="${p.assets[0].id}"><div class="viewer-nav">${p.assets.length>1?'<button data-slide-prev>←</button><button data-slide-next>→</button>':''}</div>`:`<div class="vph">Nenhum arquivo enviado</div>`}</div>${p.assets.length?`<div class="strip">${p.assets.map((a,i)=>`<button class="${i===0?'active':''}" data-slide="${i}"><img data-asset-img="${a.id}"></button>`).join('')}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${p.assets.length?'<button class="btn sm" data-action="downloadCurrent">Baixar slide</button><button class="btn sm" data-action="downloadAll">Baixar todos</button>':''}<button class="btn sm" data-action="copyCaption">Copiar legenda</button></div></div><div><div class="meta-box"><h4>Detalhes</h4><p>${esc(p.platform==='instagram'?'Instagram':'Site')} · ${esc(p.format)}${p.campaign?'\nCampanha: '+esc(p.campaign):''}${p.tags?.length?'\nTags: '+esc(p.tags.join(', ')):''}</p></div><div class="meta-box"><h4>Legenda / observações</h4><p>${p.caption?esc(p.caption):'<span style="color:var(--muted)">Sem legenda.</span>'}</p></div>${scheduleBox}<div class="meta-box"><h4>Comentários</h4><div class="comments">${(p.comments||[]).length?p.comments.map(c=>`<div class="comment"><b>${esc(c.by)}</b><small>${new Date(c.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</small><p>${esc(c.text)}</p></div>`).join(''):'<div style="color:var(--muted);font-size:10px">Nenhum comentário.</div>'}</div><div class="comment-form"><input id="commentText" placeholder="Escrever comentário..."><button class="btn sm" data-action="comment">Enviar</button></div></div></div></div><div class="modal-actions" style="justify-content:space-between;align-items:center">${deleteBtn}<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${actions}</div></div></div></div></div>`;document.querySelector('[data-close]').onclick=closeOverlay;document.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))closeOverlay()};bindDetail(p);hydrateImages(o);refreshWorkflowState(p)}

async function refreshWorkflowState(p){try{const d=await apiAuth('/api/workflow/state?projectId='+encodeURIComponent(p.id));if(d.publication&&p.status!=='published'){p.status='published';p.publishedAt=d.publication.publishedAt;p.metaMediaId=d.publication.mediaId;p.updatedAt=new Date().toISOString();persistProject(p);openDetail(p.id);return}if(d.schedule&&p.status==='approved'){p.status='scheduled';p.scheduledAt=d.schedule.scheduledAt;p.updatedAt=new Date().toISOString();persistProject(p)}}catch(e){console.warn('Workflow state',e)}}

function bindDetail(p){const q=s=>document.querySelector(s);const comment=q('[data-action="comment"]');if(comment)comment.onclick=()=>{const inp=q('#commentText'),txt=inp.value.trim();if(!txt)return;p.comments=p.comments||[];p.comments.push({id:id('c'),text:txt,by:roleName(),at:new Date().toISOString()});p.updatedAt=new Date().toISOString();persistProject(p);addActivity('Comentou em um conteúdo',p.id,p.title);openDetail(p.id)};const sch=q('[data-action="schedule"]');if(sch)sch.onclick=async()=>{const d=q('#dDate').value,t=q('#dTime').value;if(!d){toast('Escolha uma data','err');return}const scheduledAt=new Date(`${d}T${t||'12:00'}`).toISOString();sch.disabled=true;try{await apiAuth('/api/workflow/schedule',{method:'POST',body:JSON.stringify({project:p,scheduledAt})});p.scheduledAt=scheduledAt;p.status='scheduled';p.updatedAt=new Date().toISOString();persistProject(p);addActivity('Agendou publicação',p.id,p.title+' · '+new Date(scheduledAt).toLocaleString('pt-BR'));toast('Publicação agendada');openDetail(p.id)}catch(e){toast(e.message,'err');sch.disabled=false}};const cp=q('[data-action="copyCaption"]');if(cp)cp.onclick=async()=>{await navigator.clipboard.writeText(p.caption||'');toast('Legenda copiada')};const del=q('[data-action="delete"]');if(del)del.onclick=async()=>{if(!confirm('Excluir este conteúdo e seus arquivos?'))return;try{await apiAuth('/api/workflow/invalidate',{method:'POST',body:JSON.stringify({projectId:p.id})})}catch{}for(const a of p.assets){if(a.path){try{await deleteObject(storageRef(cloudStorage,a.path))}catch(e){console.warn(e)}}else await delAsset(a.id)}state.projects=state.projects.filter(x=>x.id!==p.id);save();await removeProjectCloud(p.id);addActivity('Excluiu conteúdo',p.id,p.title);closeOverlay();render();toast('Conteúdo excluído')};const send=q('[data-action="sendReview"]');if(send)send.onclick=()=>{p.status='review';p.updatedAt=new Date().toISOString();persistProject(p);addActivity('Enviou conteúdo para aprovação',p.id,p.title);toast('Enviado para aprovação');openDetail(p.id)};const ap=q('[data-action="approve"]');if(ap)ap.onclick=async()=>{ap.disabled=true;try{const d=await apiAuth('/api/workflow/approve',{method:'POST',body:JSON.stringify({project:p})});p.status='approved';p.approvedAt=d.approval.approvedAt;p.approvedBy=d.approval.approvedBy;p.scheduledAt=null;p.updatedAt=new Date().toISOString();persistProject(p);addActivity('Aprovou conteúdo',p.id,p.title);toast('Conteúdo aprovado. A designer já pode publicar.');openDetail(p.id)}catch(e){toast(e.message,'err');ap.disabled=false}};const rc=q('[data-action="requestChanges"]');if(rc)rc.onclick=async()=>{const reason=prompt('Qual alteração precisa ser feita?');if(reason===null)return;rc.disabled=true;try{await apiAuth('/api/workflow/invalidate',{method:'POST',body:JSON.stringify({projectId:p.id})});p.status='changes';p.scheduledAt=null;p.comments=p.comments||[];if(reason.trim())p.comments.push({id:id('c'),text:reason.trim(),by:roleName(),at:new Date().toISOString()});p.updatedAt=new Date().toISOString();persistProject(p);addActivity('Solicitou alteração',p.id,p.title);toast('Alteração solicitada');openDetail(p.id)}catch(e){toast(e.message,'err');rc.disabled=false}};const rs=q('[data-action="resubmit"]');if(rs)rs.onclick=()=>{p.status='review';p.updatedAt=new Date().toISOString();persistProject(p);addActivity('Reenviou para aprovação',p.id,p.title);toast('Reenviado para aprovação');openDetail(p.id)};const pub=q('[data-action="publishNow"]');if(pub)pub.onclick=async()=>{if(!confirm('Publicar este conteúdo agora no Instagram da LeadsPay?'))return;pub.disabled=true;pub.textContent='Publicando...';try{const d=await apiAuth('/api/meta/publish',{method:'POST',body:JSON.stringify({project:p})});p.status='published';p.publishedAt=d.publication.publishedAt;p.metaMediaId=d.publication.mediaId;p.scheduledAt=null;p.updatedAt=new Date().toISOString();persistProject(p);addActivity('Publicou no Instagram',p.id,p.title+' · ID '+d.publication.mediaId);toast('Publicado no Instagram com sucesso');openDetail(p.id)}catch(e){toast(e.message,'err');pub.disabled=false;pub.textContent='Publicar agora'}};const dc=q('[data-action="downloadCurrent"]');if(dc)dc.onclick=()=>downloadAsset(p.assets[state.detailSlide],p);const da=q('[data-action="downloadAll"]');if(da)da.onclick=async()=>{for(let i=0;i<p.assets.length;i++){await downloadAsset(p.assets[i],p,i);await new Promise(r=>setTimeout(r,250))}toast('Downloads iniciados')};document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>setDetailSlide(p,+b.dataset.slide));const pr=q('[data-slide-prev]'),nx=q('[data-slide-next]');if(pr)pr.onclick=()=>setDetailSlide(p,(state.detailSlide-1+p.assets.length)%p.assets.length);if(nx)nx.onclick=()=>setDetailSlide(p,(state.detailSlide+1)%p.assets.length)}
async function setDetailSlide(p,i){state.detailSlide=i;const v=document.getElementById('viewer'),meta=p.assets[i];if(meta?.url){const img=v.querySelector('img');img.src=meta.url}else{const a=await getAsset(meta.id);if(a?.blob){const img=v.querySelector('img');img.src=URL.createObjectURL(a.blob)}}document.querySelectorAll('[data-slide]').forEach((b,j)=>b.classList.toggle('active',j===i))}
async function downloadAsset(a,p,index=null){try{let blob;if(a.url){const res=await fetch(a.url);if(!res.ok)throw new Error('download');blob=await res.blob()}else{const obj=await getAsset(a.id);blob=obj?.blob}if(!blob)return;const url=URL.createObjectURL(blob),x=document.createElement('a');x.href=url;const ext=(a.name.split('.').pop()||'png').replace(/[^a-z0-9]/gi,'');const n=index===null?state.detailSlide:index;x.download=`${slug(p.title)}${p.assets.length>1?'-slide-'+String(n+1).padStart(2,'0'):''}.${ext}`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch{toast('Não foi possível baixar o arquivo','err')}}
function slug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'leadspay'}
function infoModal(title,text){document.getElementById('overlay').innerHTML=`<div class="modal-back"><div class="modal sm"><div class="modal-h"><h2>${esc(title)}</h2><button class="x" data-close>×</button></div><div class="modal-b"><p style="color:#cfc7d7;font-size:12px;line-height:1.7;white-space:pre-line">${esc(text)}</p><div class="modal-actions"><button class="btn primary" data-close2>Entendi</button></div></div></div></div>`;document.querySelector('[data-close]').onclick=closeOverlay;document.querySelector('[data-close2]').onclick=closeOverlay}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),projects:state.projects,activity:state.activity,settings:state.settings},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leadspay-connect-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup de dados exportado')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.projects))throw new Error();if(!confirm('Importar este backup substituirá os dados de organização atuais. Continuar?'))return;state.projects=d.projects;state.activity=Array.isArray(d.activity)?d.activity:[];state.settings={...defaultSettings,...(d.settings||{})};save();Promise.all(state.projects.map(p=>persistProject(p)));persistSettings();addActivity('Importou backup de dados');toast('Backup importado');render()}catch{toast('Arquivo de backup inválido','err')}};r.readAsText(f)}
async function resetData(){if(!confirm('Tem certeza? Isso apagará todos os conteúdos, comentários e arquivos salvos no LeadsPay Connect.'))return;if(!confirm('Última confirmação: apagar tudo?'))return;for(const p of [...state.projects]){for(const a of (p.assets||[])){if(a.path){try{await deleteObject(storageRef(cloudStorage,a.path))}catch{}}else await delAsset(a.id)}await removeProjectCloud(p.id)}state.projects=[];state.activity=[];await clearAssets();save();addActivity('Limpou todos os dados');toast('Dados apagados');render()}
onAuthStateChanged(auth,async user=>{stopCloudSync();state.user=user;state.profile=null;state.role=null;if(!user){state.cloudStatus='connecting';render();return}const email=(user.email||'').toLowerCase();const allowed=AUTHORIZED_USERS[email];if(!allowed){toast('Esta conta não está autorizada no LeadsPay Connect.','err');await signOut(auth);return}state.profile={name:allowed.name,role:allowed.role,email};state.role=allowed.role;state.cloudStatus='connecting';render();try{const ps=await getDoc(doc(cloudDb,'users',user.uid));const existing=ps.exists()?ps.data():{};const profile={...existing,name:(existing.name&&String(existing.name).trim())?existing.name:allowed.name,role:allowed.role,email,updatedAt:new Date().toISOString(),createdAt:existing.createdAt||new Date().toISOString()};await setDoc(doc(cloudDb,'users',user.uid),profile,{merge:true});state.profile=profile;state.cloudStatus='connecting';startCloudSync();render()}catch(e){cloudFail(e,'Carregar perfil');state.profile={name:allowed.name,role:allowed.role,email};state.role=allowed.role;render()}});

render();
})();
</script>
